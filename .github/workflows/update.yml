name: Update feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - channels.json
      - instances.json
      - scripts/**
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds and probe instances
        run: python scripts/fetch_feed.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data thumbs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update feed [skip ci]"
            git push
          fi
